# Minimal MPD for a jukebox. Give the sidecar its own MPD: it treats MPD's queue as the
# jukebox playlist and expects every queue entry to be one of its stream URLs.
bind_to_address  "any"
port             "6600"
#password        "secret@read,add,control"
state_file       "/var/lib/mpd/state"
restore_paused   "yes"
zeroconf_enabled "no"

input {
    plugin "curl"
}

audio_output {
    type        "alsa"
    name        "DAC"
    device      "default"
    # "software" for setGain (GAIN=mpd), "none" for fixed output (GAIN=ignore).
    mixer_type  "software"
}
