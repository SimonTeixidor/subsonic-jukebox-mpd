# Inside the server { } block that proxies your Subsonic server.
# Only jukeboxControl and getUser/getUsers (for jukeboxRole) go to the sidecar;
# everything else keeps going to the server.

location ~ ^/rest/(jukeboxControl|getUser|getUsers)(\.view)?$ {
    proxy_pass http://127.0.0.1:4534;
    proxy_set_header Host $host;
}

location / {
    proxy_pass http://127.0.0.1:4533;   # your Subsonic server
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
